name: "Render parity (serial vs parallel)"
# 仅用于验证 _plugins/parallel-render.rb：同一 runner 上分别串行/并行构建，
# 固定 site.time 后逐字节比对 _site，并输出两者耗时。不部署。
on:
  workflow_dispatch:
  push:
    branches:
      - perf/parallel-render

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      # 只恢复不保存，避免污染正式部署用的缓存
      - uses: actions/cache/restore@v4
        with:
          path: .jekyll-cache
          key: jekyll-cache-${{ github.run_id }}
          restore-keys: |
            jekyll-cache-

      - name: Fixed build time
        run: |
          echo "time: 2026-01-01 00:00:00 +0000" > "$RUNNER_TEMP/parity.yml"
          nproc

      - name: Serial build (warm-up, also fills cache)
        run: bundle exec jekyll b -d _serial0 --config "_config.yml,$RUNNER_TEMP/parity.yml"
        env: { JEKYLL_ENV: production }

      - name: Serial build
        run: time bundle exec jekyll b -d _serial --config "_config.yml,$RUNNER_TEMP/parity.yml"
        env: { JEKYLL_ENV: production }

      - name: Parallel build
        run: time bundle exec jekyll b -d _parallel --config "_config.yml,$RUNNER_TEMP/parity.yml"
        env: { JEKYLL_ENV: production, JEKYLL_RENDER_WORKERS: auto }

      - name: Serial build (again)
        run: time bundle exec jekyll b -d _serial2 --config "_config.yml,$RUNNER_TEMP/parity.yml"
        env: { JEKYLL_ENV: production }

      - name: Parallel build (again)
        run: time bundle exec jekyll b -d _parallel2 --config "_config.yml,$RUNNER_TEMP/parity.yml"
        env: { JEKYLL_ENV: production, JEKYLL_RENDER_WORKERS: auto }

      - name: Compare outputs
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import filecmp, os
          def walk(root):
              out = set()
              for d, _, fs in os.walk(root):
                  for f in fs:
                      out.add(os.path.relpath(os.path.join(d, f), root))
              return out
          for a, b in [("_serial", "_serial2"), ("_serial", "_parallel"), ("_parallel", "_parallel2")]:
              fa, fb = walk(a), walk(b)
              diff = sorted(f for f in fa & fb if not filecmp.cmp(f"{a}/{f}", f"{b}/{f}", shallow=False))
              print(f"### {a} vs {b}: files {len(fa)} / {len(fb)}, only-left {len(fa-fb)}, only-right {len(fb-fa)}, differing {len(diff)}")
              for f in sorted(fa - fb)[:10]: print(f"- only in {a}: `{f}`")
              for f in sorted(fb - fa)[:10]: print(f"- only in {b}: `{f}`")
              for f in diff[:40]: print(f"- differs: `{f}`")
              for f in diff[:6]:
                  x = open(f"{a}/{f}", "rb").read().decode("utf-8", "replace")
                  y = open(f"{b}/{f}", "rb").read().decode("utf-8", "replace")
                  i = next((k for k in range(min(len(x), len(y))) if x[k] != y[k]), min(len(x), len(y)))
                  print(f"
`{f}` first diff at {i} (len {len(x)} vs {len(y)})
```
A: {x[max(0,i-300):i+300]}
---
B: {y[max(0,i-300):i+300]}
```")
          PY
          diff -rq _serial _parallel > /dev/null && echo "::notice::serial vs parallel IDENTICAL" || { echo "::error::serial vs parallel DIFFER (see job summary)"; exit 1; }
